<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css'rel='stylesheet'> 
    <link rel="stylesheet" href="styleTelaInicial.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">  
    <title>FinanSee</title>
</head>
<body>
    <main class="Container">
        <form>
            <h1>Login FinanSee</h1>
            <div id="msgError"></div>
            <div class="input-box">
                <input type="text" id="usuario" placeholder="Email " required>
                <label id="labelUsuario" for="usuario"></label>
                <i class="bx bxs-user"></i>
            </div>
            <div class="input-box">
                <input placeholder="Senha" type="password" id="senha" required>
                <label id="labelSenha" for="senha"> </label>
                <i id="verSenha" class="fa fa-eye" aria-hidden="true"></i>
            </div>


            <button type="submit" class="login" onclick="entrar(event)">Login</button>

            <div class="register-link">
                <p>Não tem uma conta ? <a href="../cadastrar/cadastro.html">Cadastre-se</a></p>
            </div>
        </form>
    </main>
    
    <script>
        let btn = document.querySelector('#verSenha')

    btn.addEventListener('click', ()=>{
        let inputSenha = document.querySelector('#senha')

        if(inputSenha.getAttribute('type') === 'password'){
            inputSenha.setAttribute('type', 'text')
        } else {
            inputSenha.setAttribute('type', 'password')
        }
    })

    async function entrar(event) {
    event.preventDefault();

    const usuario = document.querySelector("#usuario");
    const senha = document.querySelector("#senha");
    const msgError = document.querySelector("#msgError");

    const usuarioLabel = document.querySelector("#labelUsuario");
    const senhaLabel = document.querySelector("#labelSenha");

    // Limpa mensagens e estilos de erro anteriores
    msgError.innerHTML = "";

    usuario.style.borderColor = "";
    senha.style.borderColor = "";

    usuarioLabel.style.color = "";
    senhaLabel.style.color = "";

    // Verifica campos vazios
    if (
        usuario.value.trim() === "" ||
        senha.value.trim() === ""
    ) {
        msgError.innerHTML = "Preencha todos os campos!";
        msgError.style.color = "red";
        return;
    }

    try {

        const dados = new URLSearchParams();

        dados.append("email", usuario.value.trim());
        dados.append("senha", senha.value);

        const resposta = await fetch("../login", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: dados.toString()
        });

        const mensagem = await resposta.text();

        if (resposta.ok) {

            alert(mensagem);

            window.location.href =
                "../HomePgae/HomePage.html";

        } else {

            usuarioLabel.style.color = "red";
            usuario.style.borderColor = "red";

            senhaLabel.style.color = "red";
            senha.style.borderColor = "red";

            msgError.style.display = "block";
            msgError.style.color = "red";
            msgError.innerHTML = mensagem;

            usuario.focus();
        }

    } catch (erro) {

        console.error("Erro ao realizar login:", erro);

        msgError.style.display = "block";
        msgError.style.color = "red";
        msgError.innerHTML =
            "Erro ao conectar com o servidor.";
    }
}
    </script>
</body>
</html>
